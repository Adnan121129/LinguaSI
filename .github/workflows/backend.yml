name: Backend

on:
  push:
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linguasi
          POSTGRES_PASSWORD: linguasi
          POSTGRES_DB: linguasi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linguasi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://linguasi:linguasi@localhost:5432/linguasi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Tests (Mock AI Mode)
        run: pytest
