name: E2E

# The acceptance journey in a real browser: the production web build against the API in Mock AI Mode.
on:
  push:
    paths: ["backend/**", "database/**", "web/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "database/**", "web/**", ".github/workflows/e2e.yml"]

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linguasi
          POSTGRES_PASSWORD: linguasi
          POSTGRES_DB: linguasi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linguasi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://linguasi:linguasi@localhost:5432/linguasi
      BACKEND_URL: http://127.0.0.1:8000
      # The test server is plain http://localhost.
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API (Mock AI Mode)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health/ready && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Acceptance journey
        working-directory: web
        run: npm run e2e
      - name: Keep the report and API log
        if: failure()
        run: cp "$RUNNER_TEMP/api.log" web/test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
