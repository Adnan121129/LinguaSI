# Serves the mobile app's web build (a single-page app): unknown paths get index.html, so links such
# as /writing/12 open the right screen.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundles have content hashes in their names, so they can be cached for good.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
